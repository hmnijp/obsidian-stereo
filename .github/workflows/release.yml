name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');if(m.version!==process.env.TAG||p.version!==process.env.TAG){console.error('tag/manifest/package mismatch:',process.env.TAG,m.version,p.version);process.exit(1)}if(!v[m.version]){console.error('versions.json has no entry for',m.version);process.exit(1)}"
          test -f main.js
          test -f styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css
